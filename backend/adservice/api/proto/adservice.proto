syntax = "proto3";

package ad;

option go_package = "github.com/maket12/ads-service/backend/adservice/pkg/generated/ad_v1;ad_v1";

import "google/protobuf/timestamp.proto";

service AdService {
  rpc CreateAd(CreateAdRequest) returns (CreateAdResponse);
  rpc GetAd(GetAdRequest) returns (GetAdResponse);
  rpc UpdateAd(UpdateAdRequest) returns (UpdateAdResponse);
  rpc PublishAd(PublishAdRequest) returns (PublishAdResponse);
  rpc RejectAd(RejectAdRequest) returns (RejectAdResponse);
  rpc DeleteAd(DeleteAdRequest) returns (DeleteAdResponse);
  rpc DeleteAllAds(DeleteAllAdsRequest) returns (DeleteAllAdsResponse);
  rpc ListAds(ListAdsRequest) returns (ListAdsResponse);
  rpc ListAllAds(ListAllAdsRequest) returns (ListAllAdsResponse);
}

message CreateAdRequest {
  string title = 1;
  optional string description = 2;
  int64 price = 3;
  string category = 4;
  repeated string images = 5;
}

message CreateAdResponse {
  string id = 1;
}

message GetAdRequest {
  string id = 1;
}

message Ad {
  string id = 1;
  string seller_id = 2;
  string title = 3;
  optional string description = 4;
  int64 price = 5;
  string category = 6;
  string status = 7;
  repeated string images = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp updated_at = 10;
}

message GetAdResponse {
  Ad ad = 1;
}

message UpdateAdRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional int64 price = 4;
  optional string category = 5;
  repeated string images = 6;
}

message UpdateAdResponse {
  bool success = 1;
}

message PublishAdRequest {
  string id = 1;
}

message PublishAdResponse {
  bool success = 1;
}

message RejectAdRequest {
  string id = 1;
}

message RejectAdResponse {
  bool success = 1;
}

message DeleteAdRequest {
  string id = 1;
}

message DeleteAdResponse {
  bool success = 1;
}

message DeleteAllAdsRequest {
  string seller_id = 1;
}

message DeleteAllAdsResponse {
  bool success = 1;
}

message ListAdsRequest {}

message ListAdsResponse {
  repeated Ad ads = 1;
}

message ListAllAdsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListAllAdsResponse {
  repeated Ad ads = 1;
}
