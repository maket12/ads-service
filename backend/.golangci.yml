version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
  settings:
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true