syntax = "proto3";

package search;

option go_package = "github.com/maket12/ads-service/backend/searchservice/pkg/generated/search_v1;search_v1";

service SearchService {
  rpc SearchAds(SearchAdsRequest) returns (SearchAdsResponse);
}

message AdIndex {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 price = 4;
  string category = 5;
  string main_image = 6;
}

message SearchAdsRequest {
  string text = 1;
  optional string category = 2;
  optional int64 price_from = 3;
  optional int64 price_to = 4;
  int32 limit = 5;
  int32 offset = 6;
  string sort_by = 7;
}

message SearchAdsResponse {
  repeated AdIndex items = 1;
  int64 total = 2;
}
