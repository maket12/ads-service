name: Backend Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/**/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64.8
          working-directory: backend
          args: --timeout=5m ./adservice/... ./authservice/... ./gateway/... ./userservice/...

  tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/**/go.sum

      - name: Run Unit Tests
        working-directory: ./backend
        run: go test -v -short -coverprofile=unit.out -covermode=atomic ./adservice/... ./authservice/... ./gateway/... ./userservice/...

      - name: Run Integration Tests
        working-directory: ./backend
        run: go test -v -tags=integration -coverprofile=integration.out ./adservice/... ./authservice/... ./gateway/... ./userservice/...

      - name: Run E2E Tests
        working-directory: ./backend
        run: go test -v -tags=e2e ./adservice/... ./authservice/... ./gateway/... ./userservice/...